    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #000;
            --secondary: #1d1d1f;
            --accent: #0071e3;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --background: #fbfbfd;
            --card-bg: #fff;
            --border: #d2d2d7;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #f5f5f7 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            animation: fadeIn .8s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .container {
            max-width: 680px;
            width: 100%;
            animation: slideUp .8s ease-out .2s both;
        }
        
        .profile-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.04);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            transition: all .3s ease;
        }
        
        .profile-card:hover {
            box-shadow: 0 8px 32px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.06);
            transform: translateY(-4px);
        }
        
        .profile-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--background);
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
            animation: scaleIn .6s ease-out .4s both;
        }
        
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 16px 0;
            color: var(--primary);
            animation: slideUp .8s ease-out .5s both;
            letter-spacing: -.02em;
        }
        
        @media(max-width:768px) {
            h1 { font-size: 2rem; }
        }
        
        .company-logo {
            width: 80px;
            height: auto;
            margin: 20px auto;
            opacity: .85;
            animation: slideUp .8s ease-out .6s both;
        }
        
        .role {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin: 12px 0;
            font-weight: 500;
            animation: slideUp .8s ease-out .7s both;
        }
        
        .department {
            font-size: 1rem;
            color: var(--accent);
            margin: 8px 0 24px;
            font-weight: 500;
            animation: slideUp .8s ease-out .75s both;
        }
        
        .timezone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 20px 0 32px;
            padding: 12px 20px;
            background: rgba(0,113,227,.05);
            border-radius: 12px;
            border: 1px solid rgba(0,113,227,.1);
            animation: slideUp .8s ease-out .8s both;
        }
        
        .timezone-icon {
            font-size: 1.2rem;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 32px;
        }
        
        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 1rem;
            transition: all .3s ease;
            position: relative;
            overflow: hidden;
            animation: scaleIn .5s ease-out both;
        }
        
        .link-button:nth-child(1) { animation-delay: .85s; }
        .link-button:nth-child(2) { animation-delay: .9s; }
        .link-button:nth-child(3) { animation-delay: .95s; }
        .link-button:nth-child(4) { animation-delay: 1s; }
        .link-button:nth-child(5) { animation-delay: 1.05s; }
        
        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
            transition: left .5s ease;
        }
        
        .link-button:hover::before {
            left: 100%;
        }
        
        .link-button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,113,227,.25);
        }
        
        .link-button:active {
            transform: translateY(0);
        }
        
        .link-button img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        
        .icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        
        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: .875rem;
            animation: fadeIn .8s ease-out 1.2s both;
        }
        
        @media(max-width:768px) {
            .profile-card { padding: 40px 24px; }
            h1 { font-size: 2rem; }
            .role { font-size: 1rem; }
            .links { gap: 12px; }
            .link-button { padding: 14px 20px; font-size: .95rem; }
        }

        .verified-badge {
    display: inline-block;
    width: 20px;
    height: 20px;
    background: #1DA1F2;
    border-radius: 50%;
    color: white;
    text-align: center;
    line-height: 20px;
    font-size: 14px;
    margin-left: 8px;
    vertical-align: middle;
}

    </style>
</head>

    <script>
        function updateTime() {
            const now = new Date();
            const options = { 
                timeZone: 'America/Toronto', 
                hour: 'numeric', 
                minute: '2-digit', 
                hour12: true,
                timeZoneName: 'short'
            };
            const timeStr = now.toLocaleString('en-US', options);
            document.getElementById('current-time').textContent = timeStr;
        }
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
